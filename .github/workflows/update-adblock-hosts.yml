name: Update AdBlock Hosts

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-adblock-hosts.yml'
      - 'scripts/compile_hosts.py'
      - 'hosts/extra_hosts.txt'
      - 'hosts/allow_hosts.txt'
      - 'hosts/podcast_ad_hosts.txt'

permissions:
  contents: write

jobs:
  update-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile hosts/adblock_hosts.txt
        run: python3 scripts/compile_hosts.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts/adblock_hosts.txt
          git diff --staged --quiet || (git commit -m "chore(adblock): auto-update compiled hosts/adblock_hosts.txt" && git push)
